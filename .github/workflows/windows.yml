name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: py -3 -m pip install -r requirements-build.txt
      - name: Unit tests
        run: py -3 -m unittest discover -s tests -v
      - name: Build single-file EXE
        shell: pwsh
        run: ./scripts/build.ps1
      - name: CLI smoke test
        shell: pwsh
        run: ./dist/CodexRuntimeHUD.exe --once --file ./examples/sample_rollout.jsonl --lang en
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexRuntimeHUD-windows-x64
          path: |
            dist/CodexRuntimeHUD.exe
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CodexRuntimeHUD-windows-x64
          path: dist
      - name: Rename release asset
        shell: pwsh
        run: |
          $target = "CodexRuntimeHUD-${{ github.ref_name }}-windows-x64.exe"
          Rename-Item dist/CodexRuntimeHUD.exe $target
          $hash = (Get-FileHash "dist/$target" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/SHA256SUMS.txt -Encoding utf8 "$hash  $target"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodexRuntimeHUD-${{ github.ref_name }}-windows-x64.exe
            dist/SHA256SUMS.txt
          body_path: docs/releases/RELEASE_NOTES_${{ github.ref_name }}.md
